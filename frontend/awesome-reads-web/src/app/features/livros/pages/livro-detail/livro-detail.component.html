<div class="space-y-6">
  <!-- Voltar -->
  <div class="flex items-center justify-between gap-3">
    <a
      [routerLink]="['/browse']"
      class="inline-flex items-center gap-2 rounded-md border border-border bg-card px-3 py-2 text-sm font-semibold text-foreground
             hover:bg-muted focus:outline-none focus:ring-2 focus:ring-ring"
    >
      <span aria-hidden="true">←</span>
      Voltar
    </a>
  </div>

  <!-- Card do livro + form -->
  <ng-container *ngIf="livro$ | async as livro; else livroLoading">
    <section class="rounded-[var(--radius-md)] border border-border bg-card p-5 shadow-[var(--shadow-soft)]">
      <div class="flex flex-col gap-5 lg:flex-row lg:items-start lg:justify-between">
        <!-- Info do livro -->
        <div class="min-w-0">
          <h1 class="text-xl font-semibold text-primary">
            {{ livro.titulo }}
          </h1>

          <p class="mt-1 text-sm text-muted-foreground">
            {{ livro.autor }}
          </p>

          <!-- Placeholder de capa (enquanto você não tem imagem no backend) -->
          <div class="mt-4 flex gap-4">
            <div class="hidden sm:block w-24 overflow-hidden rounded-[var(--radius-sm)] border border-border bg-muted">
              <div class="aspect-[3/4] w-full grid place-items-center">
                <span class="text-xs font-semibold text-muted-foreground">CAPA</span>
              </div>
            </div>

            <div class="min-w-0">
              <p class="text-sm text-foreground">
                Veja as avaliações e deixe a sua também.
              </p>
              <p class="mt-1 text-xs text-muted-foreground">
                Sua avaliação ajuda outras pessoas a escolherem a próxima leitura.
              </p>
            </div>
          </div>
        </div>

        <!-- Form -->
        <div class="w-full lg:max-w-md">
          <div class="rounded-[var(--radius-md)] border border-border bg-background p-4">
            <div class="mb-3">
              <h2 class="text-sm font-semibold text-foreground">Sua avaliação</h2>
              <p class="text-xs text-muted-foreground">Nota e comentário.</p>
            </div>

            <app-avaliacoes-form
              [livroId]="livro.id"
              [usuarioId]="usuarioId"
              (submitted)="onSubmitAvaliacao($event)"
            ></app-avaliacoes-form>
          </div>
        </div>
      </div>
    </section>
  </ng-container>

  <!-- Lista de avaliações -->
  <section class="rounded-[var(--radius-md)] border border-border bg-card p-5 shadow-[var(--shadow-soft)]">
    <div class="flex items-end justify-between gap-3">
      <div>
        <h2 class="text-base font-semibold text-foreground">Avaliações</h2>
        <p class="mt-1 text-sm text-muted-foreground">
          O que outros leitores acharam.
        </p>
      </div>
    </div>

    <div class="mt-4">
      <ng-container *ngIf="avaliacoes$ | async as avaliacoes; else avaliacoesLoading">
        <app-avaliacoes-list
          [avaliacoes]="avaliacoes"
          (deleteClicked)="onDeleteAvaliacao($event)"
        ></app-avaliacoes-list>
      </ng-container>
    </div>
  </section>

  <!-- Loaders -->
  <ng-template #livroLoading>
    <section class="rounded-[var(--radius-md)] border border-border bg-card p-5 shadow-[var(--shadow-soft)]">
      <div class="space-y-3">
        <div class="h-6 w-72 rounded bg-muted"></div>
        <div class="h-4 w-48 rounded bg-muted"></div>
        <div class="mt-4 grid grid-cols-1 gap-3 lg:grid-cols-2">
          <div class="h-28 rounded bg-muted"></div>
          <div class="h-28 rounded bg-muted"></div>
        </div>
      </div>
    </section>
  </ng-template>

  <ng-template #avaliacoesLoading>
    <div class="rounded-[var(--radius-md)] border border-border bg-card p-5 shadow-[var(--shadow-soft)]">
      <div class="h-4 w-48 rounded bg-muted"></div>
      <div class="mt-4 space-y-3">
        <div class="h-24 rounded-[var(--radius-md)] border border-border bg-background p-4">
          <div class="h-4 w-2/3 rounded bg-muted"></div>
          <div class="mt-2 h-3 w-1/3 rounded bg-muted"></div>
        </div>
        <div class="h-24 rounded-[var(--radius-md)] border border-border bg-background p-4">
          <div class="h-4 w-1/2 rounded bg-muted"></div>
          <div class="mt-2 h-3 w-1/4 rounded bg-muted"></div>
        </div>
      </div>
    </div>
  </ng-template>
</div>
