<!-- Empty state -->
<div
  *ngIf="avaliacoes().length === 0"
  class="rounded-[var(--radius-md)] border border-border bg-background p-6 text-center"
>
  <div class="mx-auto grid h-12 w-12 place-items-center rounded-full bg-muted text-primary">
    <span class="text-lg font-semibold">★</span>
  </div>
  <h3 class="mt-3 text-sm font-semibold text-foreground">Ainda não há avaliações</h3>
  <p class="mt-1 text-sm text-muted-foreground">
    Seja o primeiro a avaliar este livro.
  </p>
</div>

<!-- List -->
<ul *ngIf="avaliacoes().length > 0" class="space-y-3">
  <li
    *ngFor="let a of avaliacoes()"
    class="rounded-[var(--radius-md)] border border-border bg-background p-4"
  >
    <div class="flex items-start justify-between gap-4">
      <!-- Conteúdo -->
      <div class="min-w-0">
        <!-- Linha 1: nota + usuário + data -->
        <div class="flex flex-wrap items-center gap-2">
          <!-- Nota em badge -->
          <span
            class="inline-flex items-center rounded-md bg-accent/20 px-2 py-1 text-xs font-semibold text-accent-foreground"
            [attr.aria-label]="'Nota ' + a.nota"
            title="Nota"
          >
            Nota {{ a.nota }}
          </span>

          <!-- Usuário -->
          <span class="text-sm font-semibold text-foreground">
            {{ a.nomeUsuario }}
          </span>

          <span class="text-xs text-muted-foreground">•</span>

          <!-- Data (depois você pode formatar com DatePipe) -->
          <span class="text-xs text-muted-foreground">
            {{ a.dataDaAvaliacao }}
          </span>
        </div>

        <!-- Linha 2: descrição -->
        <p class="mt-2 text-sm text-foreground whitespace-pre-line">
          {{ a.descricao }}
        </p>
      </div>

      <!-- Ação: excluir -->
      <button
        type="button"
        class="shrink-0 inline-flex items-center rounded-md border border-border bg-card px-3 py-2 text-sm font-semibold text-foreground
               hover:border-destructive/30 hover:bg-destructive/10 hover:text-destructive
               focus:outline-none focus:ring-2 focus:ring-ring"
        (click)="onDelete(a.id)"
      >
        Excluir
      </button>
    </div>
  </li>
</ul>
